<!-- signup.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Up</title>
    <!-- Include Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <!-- Include Firebase Firestore if using it -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <h1>Sign Up</h1>
    <input type="email" id="email" placeholder="Email" />
    <br />
    <input type="password" id="password" placeholder="Password" />
    <br />
    <button onclick="signup()">Sign Up</button>
    <div id="signupMessage"></div>

    <script>
      // Your Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyAkbmy7CVJCRzyDv-Aw37vorNNoi1e5sOc",
        authDomain: "ninjapay-plugin-backend-dev.firebaseapp.com",
        projectId: "ninjapay-plugin-backend-dev",
        storageBucket: "ninjapay-plugin-backend-dev.firebasestorage.app",
        messagingSenderId: "76820525398",
        appId: "1:76820525398:web:4378028e4c6f705a73a6f7",
        measurementId: "G-C8VB4E2X80",
      };

      firebase.initializeApp(firebaseConfig);

      // Initialize Firestore
      const db = firebase.firestore();

      function signup() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // Input validation (optional but recommended)
        if (!email || !password) {
          document.getElementById("signupMessage").innerHTML =
            '<p style="color: red;">Email and password are required.</p>';
          return;
        }

        // Send signup request to the server
        fetch("/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        })
          .then((response) => {
            if (response.ok) {
              return response.json();
            } else {
              return response.text().then((text) => {
                throw new Error(text);
              });
            }
          })
          .then((data) => {
            const customToken = data.customToken;
            // Sign in with the Custom Token to get a valid ID Token
            return firebase.auth().signInWithCustomToken(customToken);
          })
          .then((userCredential) => {
            // After signing in with the Custom Token, get the ID Token
            return userCredential.user.getIdToken();
          })
          .then((idToken) => {
            // Send ID Token to server to create session cookie
            return fetch("/auth/sessionLogin", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ idToken }),
              credentials: "include", // Include credentials in the request
            });
          })
          .then((response) => {
            if (response.ok) {
              window.location.href = "/funding";
            } else {
              return response.text().then((text) => {
                throw new Error(text);
              });
            }
          })
          .catch((error) => {
            console.error("Signup error:", error);
            document.getElementById("signupMessage").innerHTML =
              '<p style="color: red;">' + error.message + "</p>";
          });
      }
    </script>
  </body>
</html>
