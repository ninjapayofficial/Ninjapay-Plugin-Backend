<!-- plugins/doc-sign-plugin/views/sign.html -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin-top: 160px;
        margin-left: 10%;
        margin-right: 10%;
        background-color: #f6f9fd;
      }
      h1 {
        color: #333;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        margin: 10;
      }
      h2 {
        color: #333;
      }
      .document-content {
        border: 1px solid #ddd;
        padding: 20px;
        margin-bottom: 20px;
      }
      .title-content {
        font-size: large;
        font-weight: 700;
        color: #333;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;
        margin-right: 10px;
        cursor: pointer;
      }
      .signed-message {
        color: green;
        font-weight: bold;
      }
      #signatureCanvas {
        border: 1px solid #000000;
        display: block;
        margin-top: 20px;
      }
      /* Optional: Disable text selection when not editable */
      .document-content[contenteditable="false"] {
        user-select: none;
      }
    </style>
    <!-- Existing Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.1/dist/turndown.min.js"></script>
  </head>
  <body>
    <h1>Nveda Securities & Investments Pvt Ltd</h1>
    <h2>Sign Document</h2>
    
    <div id="title" class="title-content">
      <!-- Title content will be loaded here -->
    </div>
    <div id="document" class="document-content" contenteditable="false">
      <!-- Document content will be loaded here -->
    </div>

    <!-- New Edit and Save Buttons -->
    <button id="editButton">Edit Document</button>
    <button id="saveButton" style="display: none;">Save Changes</button>

    <canvas id="signatureCanvas" width="400" height="200"></canvas>
    <button id="clearButton">Clear Signature</button>
    <button id="signButton">Sign Document</button>
    <p id="message"></p>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Extract the token from the URL
        const urlParts = window.location.pathname.split('/');
        const token = urlParts[urlParts.length - 1];

        // Initialize Signature Pad
        const canvas = document.getElementById('signatureCanvas');
        const signaturePad = new SignaturePad(canvas);

        const clearButton = document.getElementById('clearButton');
        clearButton.addEventListener('click', () => {
          signaturePad.clear();
        });

        // Edit and Save Buttons
        const editButton = document.getElementById('editButton');
        const saveButton = document.getElementById('saveButton');
        const documentDiv = document.getElementById('document');

        editButton.addEventListener('click', () => {
          documentDiv.contentEditable = "true";
          documentDiv.focus();
          editButton.style.display = "none";
          saveButton.style.display = "inline-block";
        });

        saveButton.addEventListener('click', () => {
          // Optional: You can add validation or confirmation here
          documentDiv.contentEditable = "false";
          editButton.style.display = "inline-block";
          saveButton.style.display = "none";
          alert("Changes have been saved.");
        });

        const signButton = document.getElementById('signButton');
        signButton.addEventListener('click', function() {
          if (signaturePad.isEmpty()) {
            alert("Please provide a signature first.");
            return;
          }

          const signatureData = signaturePad.toDataURL(); // Base64 encoded image

          // Get the edited content from the document div
          const editedContentHTML = document.getElementById('document').innerHTML;

          // Initialize Turndown
          const turndownService = new TurndownService();

          // Convert HTML to Markdown
          const editedContentMarkdown = turndownService.turndown(editedContentHTML);

          // Optional: Validate that content is not empty
          if (!editedContentMarkdown.trim()) {
            alert("Document content cannot be empty.");
            return;
          }

          fetch(`/plugins/doc-sign-plugin/sign/${token}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // Ensure cookies are sent for auth
            body: JSON.stringify({ 
              signature: signatureData,
              content: editedContentMarkdown // Send the edited content
             }),
          })
          .then(response => response.json())
          .then(data => {
            if (data.message) {
              document.getElementById('message').innerText = data.message;
              signButton.disabled = true;
              // Disable the signature pad and editing
              signaturePad.off();
              documentDiv.contentEditable = false;
              editButton.style.display = "none";
              saveButton.style.display = "none";
            } else if (data.error) {
              alert(data.error);
            }
          })
          .catch(error => {
            console.error('Error signing document:', error);
            alert('Error signing document.');
          });
        });

        // Fetch document content from the API route
        fetch(`/plugins/doc-sign-plugin/api/document/${token}`, {
          method: 'GET',
          credentials: 'include', // Ensure cookies are sent for auth
        })
        .then(response => {
          if (response.ok) {
            return response.json();
          } else {
            throw new Error('Failed to load document.');
          }
        })
        .then(data => {
          document.getElementById('document').innerHTML = marked.parse(data.content);
          document.getElementById('title').innerHTML = data.title;
        })
        .catch(error => {
          console.error('Error fetching document:', error);
          document.getElementById('document').innerText = 'Error loading document.';
          document.getElementById('signButton').disabled = true;
          editButton.disabled = true;
        });
      });
    </script>
  </body>
</html>
