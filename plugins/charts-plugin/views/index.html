<!-- plugins/charts-plugin/views/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Advanced Candlestick Chart</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

    <div id="chart-container" style="height: 600px;"></div>
    <div id="rsi-chart-container" style="height: 200px; margin-top: 10px;"></div>

    <!-- Existing stuff -->
    <div id="actions"></div>
    <div id="ohlc-info"></div>

    <div id="toolbar" style="position:absolute; top:10px; left:10px; z-index:9999; display: flex; gap: 5px;">
        <button id="candle-btn">Candlestick</button>
        <button id="line-btn">Line</button>
        <button id="area-btn">Area</button>

        <!-- NEW: Indicators button -->
        <button id="indicator-btn" style="background:#444; color:#fff;">Indicators</button>

        <button 
            id="draw-btn" 
            title="Enable Drawing Mode" 
            style="padding:5px 10px; background:#333; color:#fff; border:none; border-radius:3px; cursor:pointer;">
            🖊️
        </button>
    </div>

    <!-- Close Drawing Mode Button -->
    <div id="drawing-toolbar" style="position:absolute; top:10px; left:350px; z-index:10000; display: none;">
        <button id="close-draw-btn" title="Exit Drawing Mode">❌</button>
    </div>

    <!-- Symbol Loader -->
    <div style="position:absolute; top:10px; left:420px; z-index:9999; display:flex; gap:5px;">
        <input type="text" id="symbol-input" placeholder="Enter symbol" 
               style="padding:5px; border-radius:3px; border:1px solid #333; background:#222; color:#fff;">
        <button 
            id="load-symbol" 
            style="padding:5px 10px; background:#333; color:#fff; border:none; border-radius:3px; cursor:pointer;">
            Load
        </button>
    </div>

    <!-- NEW: Indicator Popup (Hidden by default) -->
    <div 
        id="indicator-popup" 
        style="display:none; position:absolute; top:70px; left:10px; padding:10px; background:#222; color:#fff; border:1px solid #444; z-index:9999;">
        
        <h4>Manage Indicators</h4>

        <!-- Add RSI Form -->
        <form id="add-rsi-form" style="margin-bottom:10px;">
            <label>RSI Period:</label>
            <input type="number" name="rsi-period" placeholder="14" style="width:50px;" />
            <button type="submit">Add RSI</button>
        </form>

        <ul id="rsi-list" style="list-style:none; padding-left:0;"></ul>

        <!-- Add SMA Form -->
        <form id="add-sma-form" style="margin-bottom:10px;">
            <label>SMA Period:</label>
            <input type="number" name="sma-period" placeholder="14" style="width:50px;" />
            <label>Color:</label>
            <input type="text" name="sma-color" placeholder="#f1c40f" style="width:70px;" />
            <button type="submit">Add SMA</button>
        </form>

        <ul id="sma-list" style="list-style:none; padding-left:0;"></ul>
    </div>

    <script src="main.js"></script>
</body>
</html>
