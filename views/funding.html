<!-- funding.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Connect Funding Provider</title>
    <style>
      /* Basic styling for the page */
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1,
      h2 {
        color: #333;
      }
      .section {
        margin-bottom: 40px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        vertical-align: top;
      }
      th {
        background-color: #f2f2f2;
      }
      #message {
        color: red;
      }
      .success {
        color: green;
      }
      button {
        margin-right: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Connect Funding Provider</h1>

    <!-- Section to Add a New Provider -->
    <div class="section">
      <h2>Add a New Provider</h2>
      <label for="provider">Select Provider:</label>
      <select id="provider" onchange="showProviderFields()">
        <option value="lnbits">LNbits</option>
        <option value="opennode">OpenNode</option>
        <option value="binance">Binance</option>
        <!-- Add other providers here -->
      </select>
      <br />
      <br />

      <!-- LNbits Fields -->
      <div id="lnbits-fields" style="display: none">
        <label for="instanceUrl">LNbits Instance URL:</label>
        <input type="text" id="instanceUrl" />
        <br />
        <label for="lnbitsInvoiceKey">LNbits Invoice Key:</label>
        <input type="text" id="lnbitsInvoiceKey" />
        <br />
        <label for="lnbitsAdminKey">LNbits Admin Key:</label>
        <input type="text" id="lnbitsAdminKey" />
        <br />
      </div>

      <!-- OpenNode Fields -->
      <div id="opennode-fields" style="display: none">
        <label for="opennodeApiKey">OpenNode Invoie API Key:</label>
        <input type="text" id="opennodeApiKey" />
        <br />
        <label for="opennodeReadApiKey">OpenNode Read API Key:</label>
        <input type="text" id="opennodeReadApiKey" />
        <br />
      </div>

      <!-- Binance Fields -->
      <div id="binance-fields" style="display: none">
        <label for="binanceApiKey">Binance API Key:</label>
        <input type="text" id="binanceApiKey" />
        <br />
        <label for="binanceSecretApiKey">Binance Secret API Key:</label>
        <input type="text" id="binanceSecretApiKey" />
        <br />
      </div>

      <button onclick="connectProvider()">Connect</button>
      <div id="message"></div>
    </div>

    <!-- Section to Show Existing Providers -->
    <div class="section">
      <h2>Connected Providers</h2>
      <table id="providersTable">
        <thead>
          <tr>
            <th>Provider</th>
            <th>Details</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Provider rows will be populated here -->
        </tbody>
      </table>
    </div>

    <script>
      function showProviderFields() {
        const provider = document.getElementById("provider").value;
        document.getElementById("lnbits-fields").style.display =
          provider === "lnbits" ? "block" : "none";
        document.getElementById("opennode-fields").style.display =
          provider === "opennode" ? "block" : "none";
        document.getElementById("binance-fields").style.display =
          provider === "binance" ? "block" : "none";
      }

      function connectProvider() {
        const provider = document.getElementById("provider").value;
        const data = { provider };

        if (provider === "lnbits") {
          data.instanceUrl = document.getElementById("instanceUrl").value;
          data.invoiceKey = document.getElementById("lnbitsInvoiceKey").value;
          data.adminKey = document.getElementById("lnbitsAdminKey").value;
        } else if (provider === "opennode") {
          data.apiKey = document.getElementById("opennodeApiKey").value;
          data.readApiKey = document.getElementById("opennodeReadApiKey").value;
        } else if (provider === "binance") {
          data.apiKey = document.getElementById("binanceApiKey").value;
          data.secretApiKey = document.getElementById("binanceSecretApiKey").value;
        }

        // // Debug: Log data being sent
        // console.log('Data being sent:', data);
        // Handle other providers as needed

        fetch("/auth/addFundingProvider", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(data),
          credentials: "include",
        })
          .then((response) => {
            if (response.ok) {
              document.getElementById("message").innerText = "";
              loadProviders(); // Reload the providers list
            } else {
              return response.text().then((text) => {
                throw new Error(text);
              });
            }
          })
          .catch((error) => {
            document.getElementById("message").innerText = error.message;
          });
      }

      function loadProviders() {
        fetch("/auth/getFundingProviders", {
          credentials: "include",
        })
          .then((response) => response.json())
          .then((providers) => {
            const tbody = document.querySelector("#providersTable tbody");
            tbody.innerHTML = "";
            providers.forEach((provider) => {
              const tr = document.createElement("tr");
              let details = "";
              if (provider.provider === "lnbits") {
                details = `
              <strong>Instance URL:</strong> ${provider.instanceUrl || ""}<br>
              <strong>Provider Invoice Key:</strong> ${provider.providerInvoiceKey}<br>
              <strong>Provider Admin Key:</strong> ${provider.providerAdminKey}
            `;
              } else if (provider.provider === "opennode") {
                details = `
              <strong>Provider Invoice Key:</strong> ${provider.providerInvoiceKey}<br>
              <strong>Provider Admin Key:</strong> ${provider.providerAdminKey}
            `;
              } else if (provider.provider === "binance") {
                details = `
              <strong>Provider Invoice Key:</strong> ${provider.providerInvoiceKey}<br>
              <strong>Provider Admin Key:</strong> ${provider.providerAdminKey}
            `;
              }
              tr.innerHTML = `
            <td>${provider.provider}</td>
            <td>${details}</td>
            <td>
              <button onclick="setDefaultProvider('${provider.provider}')">Set as Default</button>
              <button onclick="removeProvider('${provider.providerInvoiceKey}')">Remove</button>
            </td>
          `;
              tbody.appendChild(tr);
            });
            // Fetch the default provider to highlight it
            getDefaultProvider();
          })
          .catch((error) => {
            console.error("Error loading providers:", error);
          });
      }

      function removeProvider(providerInvoiceKey) {
        if (confirm("Are you sure you want to remove this provider?")) {
          fetch("/auth/removeFundingProvider", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ providerInvoiceKey }),
            credentials: "include",
          })
            .then((response) => {
              if (response.ok) {
                loadProviders(); // Reload the providers list
              } else {
                return response.text().then((text) => {
                  throw new Error(text);
                });
              }
            })
            .catch((error) => {
              console.error("Error removing provider:", error);
              alert("Error removing provider.");
            });
        }
      }

      function setDefaultProvider(provider) {
        fetch("/auth/setDefaultProvider", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ provider }),
          credentials: "include",
        })
          .then((response) => {
            if (response.ok) {
              document.getElementById("message").innerText =
                "Default provider set successfully.";
              document.getElementById("message").className = "success";
              loadProviders(); // Reload the providers list to reflect changes
            } else {
              return response.text().then((text) => {
                throw new Error(text);
              });
            }
          })
          .catch((error) => {
            document.getElementById("message").innerText = error.message;
            document.getElementById("message").className = "";
          });
      }

      function getDefaultProvider() {
        fetch("/auth/getDefaultProvider", {
          credentials: "include",
        })
          .then((response) => response.json())
          .then((data) => {
            const defaultProvider = data.defaultProvider;
            const rows = document.querySelectorAll("#providersTable tbody tr");
            rows.forEach((row) => {
              const providerName = row.cells[0].innerText;
              if (providerName === defaultProvider) {
                row.style.backgroundColor = "#d0f0c0"; // Light green background for default provider
              } else {
                row.style.backgroundColor = "";
              }
            });
          })
          .catch((error) => {
            console.error("Error fetching default provider:", error);
          });
      }

      // Load providers and set up page on load
      window.onload = function () {
        showProviderFields();
        loadProviders();
      };
    </script>
  </body>
</html>
